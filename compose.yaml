name: treehool
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/diary.sqlite
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - diary-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  diary-data:
